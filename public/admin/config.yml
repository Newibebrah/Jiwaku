backend:
  name: github
  branch: main
  repo: Newibebrah/Jiwaku
  base_url: https://jiwaku-ten.vercel.app
  auth_endpoint: /api/auth
  auth_scope: repo

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site
    label: Pengaturan Situs
    files:
      - name: settings
        label: Pengaturan
        file: content/site.md
        fields:
          - { label: "Judul", name: "title", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Deskripsi", name: "description", widget: "text" }
          - { label: "Teks Footer", name: "footer_text", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Lokasi", name: "location", widget: "string" }
          - { label: "Sosial Media", name: "social", widget: "string" }

  - name: poems
    label: Puisi
    label_singular: Puisi
    folder: content/poems
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Baris Pembuka", name: "excerpt", widget: "text" }
      - label: "Isi Puisi"
        name: body
        widget: markdown
        editor_components:
          - align-left
          - align-center
          - align-right
          - align-justify

  - name: writings
    label: Tulisan
    label_singular: Tulisan
    folder: content/writings
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Ringkasan", name: "excerpt", widget: "text" }
      - label: "Isi"
        name: body
        widget: markdown
        editor_components:
          - align-left
          - align-center
          - align-right
          - align-justify

  - name: photos
    label: Fotografi
    label_singular: Foto
    folder: content/photos
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{location}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Lokasi", name: "location", widget: "string" }
      - { label: "Foto Identitas", name: "image", widget: "image" }
      - label: "Batch Foto (klik untuk lihat)"
        name: images
        widget: list
        collapsed: true
        summary: "Foto {{index}}"
        field: { label: "Foto", name: "image", widget: "image" }
      - { label: "Narasi", name: "caption", widget: "text" }
      - label: "Posisi Teks Narasi"
        name: align
        widget: select
        default: left
        options:
          - { label: "Kiri", value: "left" }
          - { label: "Tengah", value: "center" }
          - { label: "Kanan", value: "right" }
          - { label: "Rata", value: "justify" }
