<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <base href="/admin/">
    <title>JIWAKU — Admin</title>
</head>
<body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="/admin/align-components.js"></script>
    <script src="/admin/poem-editor.js"></script>
    <style>
        .poem-editor { font-size: 0.9rem; }
        .poem-editor-toolbar {
            display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
            padding: 6px 8px; border: 1px solid var(--foreground-40, #ccc); border-bottom: none;
            background: var(--background, #fff); border-radius: 6px 6px 0 0;
        }
        .poem-editor-btn {
            min-width: 30px; padding: 4px 8px; font-size: 0.85rem; line-height: 1.2;
            border: 1px solid var(--foreground-40, #ccc); border-radius: 4px;
            background: var(--background, #fff); color: var(--foreground, #333); cursor: pointer;
        }
        .poem-editor-btn:hover { background: var(--background-alt, #f5f5f5); }
        .poem-editor-sep { width: 1px; height: 18px; background: var(--foreground-40, #ccc); margin: 0 4px; }
        .poem-editor-textarea {
            width: 100%; min-height: 320px; padding: 10px 12px;
            font-family: Georgia, 'Times New Roman', serif; font-size: 1.05rem; line-height: 1.7;
            border: 1px solid var(--foreground-40, #ccc); border-radius: 0 0 6px 6px;
            box-sizing: border-box; resize: vertical; white-space: pre-wrap;
        }
        .poem-editor-textarea:focus { outline: none; border-color: var(--primary, #3f4a86); }
        .poem-editor-preview { font-family: Georgia, 'Times New Roman', serif; line-height: 1.8; }
        .poem-editor-preview p { margin: 0 0 0.9em; }
    </style>
</body>
</html>
